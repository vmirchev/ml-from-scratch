model:
  weight_init: xavier
  
  layers:
    - type: linear
      out_features: 64
    - type: relu
    - type: linear
      out_features: 32
    - type: relu
    - type: linear
      out_features: 1

training:
  seed: 42
  epochs: 500
  batch_size: 16
  lr: 0.01
  l2_lambda: 0.001
  test_size: 0.2
  val_size_from_test: 0.5

paths:
  model_path: api/artifacts/breast_cancer_model.npz
  artifact_manifest_path: api/artifacts/artifact_manifest.json
  training_data_path: data/breast_cancer_data.csv